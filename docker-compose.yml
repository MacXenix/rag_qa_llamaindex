services:
  postgres:
    image: postgres:15-alpine
    container_name: ragqa_postgres
    environment:
      POSTGRES_USER: ragqa
      POSTGRES_PASSWORD: ragqa
      POSTGRES_DB: ragqa
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ragqa"]
      interval: 5s
      timeout: 5s
      retries: 5

  chromadb:
    image: chromadb/chroma:0.5.23
    container_name: ragqa_chromadb
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      ANONYMIZED_TELEMETRY: "false"

volumes:
  postgres_data:
  chroma_data: